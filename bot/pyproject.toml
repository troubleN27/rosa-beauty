[project]
name = "rosa-beauty-bot"
version = "0.1.0"
description = "Rosa Beauty: Telegram bot for salon appointments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.33.0",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
